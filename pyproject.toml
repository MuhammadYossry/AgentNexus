[tool.poetry]
name = "python-code-agent"
version = "0.0.1"
description = "A PydanticAI Agent for Python code tasks"
authors = ["Yossry <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.6"
pydantic = "^2.10.3"
uvicorn = "^0.32.1"
black = "^24.10.0"
pylint = "^3.3.2"
asyncpg = "^0.30.0"
openai = "^1.59.3"
loguru = "^0.7.3"
pydantic-settings = "^2.7.1"
jinja2 = "^3.1.5"
redis = "^5.2.1"
pytest = "^8.3.5"
pytest-asyncio = "^0.25.3"


[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^0.25.3"
pytest-cov = "^6.0.0"
pytest-html = "^4.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
