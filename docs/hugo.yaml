# Hugo configuration file
title: AgentNexus - Alpha
baseURL: "https://muhammadyossry.github.io/AgentNexus/"

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra
  - path: github.com/hugomods/icons/vendors/lucide

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: "https://github.com/MuhammadYossry/AgentNexus"
      params:
        icon: github
    - name: Twitter
      weight: 4
      url: "https://twitter.com/yossry_i"
      params:
        icon: x-twitter

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/MuhammadYossry/AgentNexus/edit/main/content"